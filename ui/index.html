<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Office Hub</title>
<style>
  :root {
    --bg: #0d1017; --side: #11151d; --panel: #151a23; --raise: #1b212c; --line: #262d3a;
    --text: #d9d6e6; --muted: #a8a4bc; --accent: #55a0ff; --ok: #3ddc97; --warn: #f2b544; --bad: #ff6b6b;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text); overflow: hidden;
    font: 14px/1.55 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  }
  .app { display: grid; grid-template-columns: 268px 1fr; height: 100vh; }

  /* ---------- sidebar ---------- */
  aside { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .brand { padding: 18px 18px 12px; }
  .brand h1 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: .2px; }
  .brand p { margin: 3px 0 0; color: var(--muted); font-size: 12.5px; }
  .lang { display: flex; gap: 6px; padding: 0 14px 10px; }
  .lang button { flex: 1; background: var(--raise); border: 1px solid var(--line); color: var(--muted); padding: 5px 0; border-radius: 8px; font-size: 12px; cursor: pointer; letter-spacing: .04em; }
  .lang button.on { border-color: var(--accent); color: #e7e4f4; background: #1b2a3f; }
  .search { padding: 0 14px 12px; }
  .search input {
    width: 100%; background: var(--raise); border: 1px solid var(--line); color: var(--text);
    padding: 9px 11px; border-radius: 10px; font-size: 13.5px;
  }
  .search input:focus { outline: none; border-color: var(--accent); }
  nav { flex: 1; min-height: 0; overflow: auto; padding: 2px 8px 10px; }
  nav button {
    display: flex; width: 100%; align-items: center; gap: 8px; text-align: left; cursor: pointer;
    background: none; border: 0; border-radius: 9px; color: var(--muted); padding: 8px 10px; font-size: 13.5px;
  }
  nav button:hover { background: var(--raise); color: var(--text); }
  nav button.on { background: #1b2a3f; color: #cfe4ff; }
  nav button .n { margin-left: auto; font-size: 12px; color: var(--muted); }
  .sidefoot { border-top: 1px solid var(--line); padding: 12px 14px; display: grid; gap: 9px; }
  .switch { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12.5px; cursor: pointer; }
  .sidefoot .note { color: #a8a4bc; font-size: 11.5px; word-break: break-all; }
  .loc { display: grid; gap: 7px; padding-bottom: 10px; border-bottom: 1px dashed var(--line); }
  .locrow { display: flex; gap: 6px; }
  .locrow input {
    flex: 1; min-width: 0; background: var(--raise); border: 1px solid var(--line); color: var(--text);
    padding: 7px 9px; border-radius: 8px; font: 12px ui-monospace, Consolas, monospace;
  }
  .locrow input:focus { outline: none; border-color: var(--accent); }
  .locrow .btn { padding: 6px 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip {
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: 11.5px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--raise); color: var(--muted); cursor: pointer;
  }
  .chip:hover { border-color: var(--accent); color: var(--text); }
  .chip.on { border-color: var(--accent); color: #cfe4ff; background: #16304a; }
  .btn {
    background: var(--raise); border: 1px solid var(--line); color: var(--text);
    padding: 8px 12px; border-radius: 10px; cursor: pointer; font-size: 13.5px; white-space: nowrap;
  }
  .btn:hover { border-color: var(--accent); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.go { background: var(--accent); border-color: var(--accent); color: #04121f; font-weight: 600; }
  .btn.ghost { background: transparent; }

  /* ---------- main ---------- */
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .topbar { display: flex; align-items: center; gap: 12px; padding: 14px 22px; border-bottom: 1px solid var(--line); background: #0f131b; }
  .topbar .title { font-size: 15.5px; font-weight: 640; }
  .topbar .count { color: var(--muted); font-size: 12.5px; }
  .topbar .spacer { flex: 1; }
  .topbar select { background: var(--raise); border: 1px solid var(--line); color: var(--text); padding: 7px 10px; border-radius: 9px; font-size: 13px; }
  .status { font-size: 12.5px; color: var(--muted); max-width: 44ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .status.bad { color: var(--bad); }
  .status.ok { color: var(--ok); }
  .scroll { overflow: auto; padding: 18px 22px 120px; flex: 1; min-height: 0; }
  .details { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 18px; font-size: 13.5px; color: #cfcadd; }
  .details summary { cursor: pointer; font-weight: 600; color: var(--text); }
  .details a { color: var(--accent); }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: #a8a4bc; margin: 22px 0 10px; }
  h2:first-of-type { margin-top: 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(390px, 1fr)); gap: 14px; }

  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 15px; display: flex; flex-direction: column; gap: 10px; transition: border-color .15s, transform .15s;
  }
  .card:hover { border-color: #3a475c; transform: translateY(-1px); }
  .card.has { border-color: #23503e; background: #131a17; }
  .card.busy { border-color: var(--accent); }
  .r1 { display: flex; gap: 10px; align-items: flex-start; }
  .nm { font-size: 15.5px; font-weight: 650; color: #e7e4f4; }
  .rp { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .pill { margin-left: auto; font-size: 11.5px; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
  .pill.has { background: #14351f; color: var(--ok); }
  .pill.no { background: var(--raise); color: var(--muted); }
  .pill.off { background: #241f2e; color: #c8bfe0; }
  .sim { display: flex; align-items: center; gap: 8px; }
  .dots { display: flex; gap: 4px; }
  .dots i { width: 26px; height: 5px; border-radius: 3px; background: var(--raise); display: block; }
  .dots i.f { background: var(--warn); }
  .sim span { font-size: 11.5px; color: var(--muted); }
  .sm { font-size: 13.5px; color: #c6c2d6; }
  .cv { font-size: 12.5px; color: var(--warn); background: #221c10; border: 1px solid #3a2f14; border-radius: 9px; padding: 7px 10px; }
  .li { font-size: 12px; color: var(--muted); }
  .tags { display: flex; flex-wrap: wrap; gap: 5px; }
  .tag { font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; background: var(--raise); border: 1px solid var(--line); color: var(--muted); padding: 2px 7px; border-radius: 7px; }
  .tag.ms { color: #a9d4ff; border-color: #2f4f70; background: #14202e; }
  .acts { display: flex; align-items: center; gap: 8px; margin-top: auto; padding-top: 2px; }
  .acts .spacer { flex: 1; }

  /* ---------- jobs sheet ---------- */
  .jobs { position: fixed; right: 18px; bottom: 18px; width: min(660px, calc(100vw - 320px)); background: var(--panel); border: 1px solid #33405a; border-radius: var(--radius); box-shadow: 0 20px 60px rgba(0,0,0,.55); overflow: hidden; }
  .jobs.off { display: none; }
  .jobs.hide .jb { display: none; }
  .jh { display: flex; align-items: center; gap: 10px; padding: 11px 14px; cursor: pointer; background: #131924; border-bottom: 1px solid var(--line); font-weight: 620; }
  .jobs.hide .jh { border-bottom: 0; }
  .jh .badge { font-size: 11.5px; padding: 3px 9px; border-radius: 999px; background: var(--raise); color: var(--muted); font-weight: 500; }
  .jh .badge.live { background: #14293f; color: var(--accent); }
  .jb { max-height: 42vh; overflow: auto; padding: 6px 14px 12px; }
  .job { padding: 10px 0; border-bottom: 1px dashed var(--line); }
  .job:last-child { border-bottom: 0; }
  .jr { display: flex; align-items: center; gap: 9px; }
  .jr b { font-size: 13.5px; }
  .st { font-size: 11.5px; padding: 3px 9px; border-radius: 999px; }
  .st.running { background: #14293f; color: var(--accent); }
  .st.done { background: #14351f; color: var(--ok); }
  .st.failed { background: #351717; color: var(--bad); }
  .st.canceled, .st.dry-run { background: #2f2814; color: var(--warn); }
  .job .spacer { flex: 1; }
  .job summary { cursor: pointer; color: #a8a4bc; font-size: 12px; margin-top: 6px; }
  pre { margin: 6px 0 0; font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; line-height: 1.5; color: var(--muted); white-space: pre-wrap; word-break: break-word; max-height: 170px; overflow: auto; background: #0f141c; border: 1px solid var(--line); border-radius: 9px; padding: 9px; }
  .empty { color: var(--muted); padding: 10px 0 4px; font-size: 13px; }

  /* ---------- plan bar ---------- */
  .plan { position: fixed; left: 50%; transform: translateX(-50%); bottom: 20px; z-index: 8; display: none; align-items: center; gap: 10px; background: var(--raise); border: 1px solid var(--accent); border-radius: 999px; padding: 7px 8px 7px 18px; box-shadow: 0 12px 34px rgba(0,0,0,.5); }
  .plan.show { display: flex; }
  .muted { color: var(--muted); }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">
      <h1>Office Hub</h1>
      <p id="tagline"></p>
    </div>
    <div class="lang" id="lang">
      <button data-lang="ru">RU</button><button data-lang="en">EN</button>
    </div>
    <div class="search"><input id="q" type="search"></div>
    <nav id="nav"></nav>
    <div class="sidefoot">
      <div class="loc">
        <label class="switch"><input type="checkbox" id="useLoc"> <span id="tUseLoc"></span></label>
        <div class="locrow">
          <input id="loc" type="text" spellcheck="false" placeholder="D:\Programs">
          <button class="btn" id="browse"></button>
        </div>
        <div class="chips" id="locChips"></div>
        <div class="note" id="locNote"></div>
      </div>
      <label class="switch"><input type="checkbox" id="silent"> <span id="tSilent"></span></label>
      <div class="note" id="wingetNote"></div>
    </div>
  </aside>

  <main>
    <div class="topbar">
      <div>
        <div class="title" id="viewTitle"></div>
        <div class="count" id="viewCount"></div>
      </div>
      <div class="spacer"></div>
      <div class="status" id="status"></div>
      <select id="sort">
        <option value="fidelity"></option>
        <option value="name"></option>
      </select>
    </div>
    <div class="scroll">
      <details class="details" id="details">
        <summary id="tDetails"></summary>
        <div class="dbody" id="detailsBody"></div>
      </details>
      <div id="list"></div>
    </div>
  </main>
</div>

<div class="plan" id="plan">
  <span id="planCount" class="muted"></span>
  <button class="btn go" id="planRun"></button>
  <button class="btn ghost" id="planClear"></button>
</div>

<div class="jobs off hide" id="jobsBox">
  <div class="jh" id="jobsHead">
    <span id="tJobs"></span> <span class="badge" id="jobsBadge"></span>
    <span class="spacer" style="flex:1"></span>
    <span class="muted" id="jobsToggle" style="font-size:12px"></span>
  </div>
  <div class="jb" id="jobs"></div>
</div>

<script>
const STR = {
  ru: {
    tagline: 'Бесплатные замены Microsoft Office',
    search: 'Поиск: docx, таблица, почта…',
    all: 'Все программы',
    sortFidelity: 'Сначала похожие на MS Office',
    sortName: 'По названию',
    details: 'Форматы .docx, .xlsx, .pptx и что умеют бесплатные офисы',
    detailsBody: 'Все четыре офисных пакета читают и пишут <b>.docx / .xlsx / .pptx</b> — это открытая спецификация ECMA-376. Максимально точно верстку сохраняют <b>ONLYOFFICE</b> и <b>WPS Office</b> (для них это родной формат), затем <b>FreeOffice</b> и <b>LibreOffice</b> (хранит по умолчанию в .odt/.ods/.odp, формат MS включается настройкой). Хуже всего переносятся макросы VBA, поля форм Word и сквозные нумерации.<br><br>Windows 11 не позволяет программе молча назначить редактор по умолчанию для расширения — сделать это нужно один раз руками: <a href="ms-settings:defaultapps" target="_blank" rel="noopener">Параметры → Приложения по умолчанию</a>. Язык самой программы выбирает её установщик: LibreOffice спрашивает при установке, остальные берут язык Windows.',
    useLoc: 'Ставить в выбранную папку',
    browse: 'Обзор',
    locNote: 'Умеют не все пакеты: если инсталлер не поддерживает свою папку, winget поставит программу по умолчанию и напишет об этом в панели вывода.',
    silent: 'Тихая установка (без окон)',
    notInstalled: 'не установлено',
    installed: 'установлено',
    similarity: 'сходство с MS Office',
    instead: 'Вместо:',
    install: 'Установить',
    update: 'Обновить',
    installing: 'Устанавливается…',
    plan: 'в план',
    planCount: 'Выбрано:',
    planRun: 'Установить выбранное',
    planClear: 'Сбросить',
    jobs: 'Установка',
    jobsToggle: 'свернуть/развернуть',
    jobsEmpty: 'Задач пока нет. Нажмите «Установить» на карточке.',
    jobsRunning: 'выполняется',
    jobsCount: 'задач',
    logTitle: 'вывод winget',
    logEmpty: '(пока пусто)',
    installMode: 'установка',
    upgradeMode: 'обновление',
    cancel: 'Отменить',
    officialTitle: 'Официальные способы получить Microsoft Office',
    noInstall: 'без установки',
    open: 'Открыть',
    steps: 'шаги в описании',
    of: 'из',
    empty: 'Ничего не найдено — попробуйте другое слово.',
    starting: 'Запускаю:',
    started: 'задача запущена',
    error: 'Ошибка:',
    catalogError: 'Не удалось загрузить каталог:',
    folderOpening: 'Открываю выбор папки — диалог может оказаться под окном',
    folderPicked: 'Папка для установки:',
    folderCanceled: 'Выбор папки отменён',
    dryNote: 'dry: команды не выполняются ·',
  },
  en: {
    tagline: 'Free replacements for Microsoft Office',
    search: 'Search: docx, spreadsheet, mail…',
    all: 'All programs',
    sortFidelity: 'Most like MS Office first',
    sortName: 'By name',
    details: 'About .docx, .xlsx, .pptx and what the free suites do',
    detailsBody: 'All four office suites read and write <b>.docx / .xlsx / .pptx</b> — the open ECMA-376 specification. <b>ONLYOFFICE</b> and <b>WPS Office</b> preserve layout most faithfully (it is their native format), then <b>FreeOffice</b> and <b>LibreOffice</b> (which stores as .odt/.ods/.odp by default; Microsoft formats are a setting). VBA macros, Word form fields and document-wide numbering survive the move worst.<br><br>Windows 11 does not let a program quietly make itself the default handler for an extension — that one choice is yours: <a href="ms-settings:defaultapps" target="_blank" rel="noopener">Settings → Default apps</a>. The language of the installed program is up to its own installer: LibreOffice asks during setup, the others follow the Windows display language.',
    useLoc: 'Install into a chosen folder',
    browse: 'Browse',
    locNote: 'Not every package supports this: if the installer has no custom location, winget installs to its default place and says so in the output panel.',
    silent: 'Silent install (no windows)',
    notInstalled: 'not installed',
    installed: 'installed',
    similarity: 'similarity to MS Office',
    instead: 'Replaces:',
    install: 'Install',
    update: 'Update',
    installing: 'Installing…',
    plan: 'to plan',
    planCount: 'Selected:',
    planRun: 'Install selected',
    planClear: 'Clear',
    jobs: 'Installation',
    jobsToggle: 'collapse/expand',
    jobsEmpty: 'No jobs yet. Press "Install" on a card.',
    jobsRunning: 'running',
    jobsCount: 'jobs',
    logTitle: 'winget output',
    logEmpty: '(empty for now)',
    installMode: 'install',
    upgradeMode: 'upgrade',
    cancel: 'Cancel',
    officialTitle: 'Official ways to get Microsoft Office',
    noInstall: 'no install',
    open: 'Open',
    steps: 'steps above',
    of: 'of',
    empty: 'Nothing found — try another word.',
    starting: 'Starting:',
    started: 'job started',
    error: 'Error:',
    catalogError: 'Failed to load the catalog:',
    folderOpening: 'Opening the folder dialog — it may end up behind the window',
    folderPicked: 'Install folder:',
    folderCanceled: 'Folder selection canceled',
    dryNote: 'dry: commands are not run ·',
  },
};

const st = {
  data: null, q: '', cat: 'all', sort: 'fidelity', plan: new Set(), jobs: [],
  lang: localStorage.getItem('officehub.lang') || (navigator.language.startsWith('ru') ? 'ru' : 'en'),
};
const T = () => STR[st.lang];
const catTitle = (c) => (st.lang === 'ru' ? c.ru : c.en);
const txt = (o) => (st.lang === 'ru' ? o.ru : o.en);
const el = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

async function api(path, body) {
  const res = body === undefined ? await fetch(path) : await fetch(path, {
    method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'HTTP ' + res.status);
  return data;
}

function say(text, kind = '') {
  const s = el('#status');
  s.textContent = text;
  s.className = 'status ' + kind;
}

function dots(n) {
  return `<span class="dots">${[1, 2, 3, 4, 5].map((i) => `<i class="${i <= n ? 'f' : ''}"></i>`).join('')}</span>`;
}

function card(a) {
  const t = txt(a);
  const ver = st.data.installed[a.id];
  const busy = st.jobs.some((j) => j.appId === a.id && j.status === 'running');
  const s = T();
  return `<article class="card${ver ? ' has' : ''}${busy ? ' busy' : ''}" data-id="${esc(a.id)}">
    <div class="r1">
      <div>
        <div class="nm">${esc(a.name)}</div>
        <div class="rp">${s.instead} ${esc(t.replaces)}</div>
      </div>
      <span class="pill ${ver ? 'has' : 'no'}">${ver ? '✓ ' + esc(ver) : s.notInstalled}</span>
    </div>
    <div class="sim">${dots(a.fidelity)}<span>${s.similarity}</span></div>
    <div class="sm">${esc(t.summary)}</div>
    ${t.caveats ? `<div class="cv">⚠ ${esc(t.caveats)}</div>` : ''}
    <div class="li">${esc(t.license)}</div>
    <div class="tags">${a.formats.map((f) => `<span class="tag${/\.(docx|xlsx|pptx|doc|xls|ppt)$/.test(f) ? ' ms' : ''}">${esc(f)}</span>`).join('')}</div>
    <div class="acts">
      <label class="switch"><input type="checkbox" class="planbox" ${st.plan.has(a.id) ? 'checked' : ''}> ${s.plan}</label>
      <span class="spacer"></span>
      <button class="btn inst go" ${busy ? 'disabled' : ''}>${busy ? s.installing : s.install}</button>
      ${ver ? `<button class="btn upg">${s.update}</button>` : ''}
    </div>
  </article>`;
}

function visible() {
  const q = st.q.trim().toLowerCase();
  return st.data.apps
    .filter((a) => st.cat === 'all' || a.category === st.cat)
    .filter((a) => !q || [a.name, txt(a).replaces, txt(a).summary, txt(a).license, a.formats.join(' ')].join(' ').toLowerCase().includes(q))
    .sort((x, y) => st.sort === 'name' ? x.name.localeCompare(y.name) : y.fidelity - x.fidelity);
}

function renderNav() {
  const cats = [{ id: 'all', ru: T().all, en: T().all }, ...st.data.categories];
  el('#nav').innerHTML = cats.map((c) => {
    const n = c.id === 'all' ? st.data.apps.length : st.data.apps.filter((a) => a.category === c.id).length;
    return `<button data-cat="${c.id}" class="${st.cat === c.id ? 'on' : ''}">${esc(catTitle(c))}<span class="n">${n}</span></button>`;
  }).join('');
  el('#nav').querySelectorAll('button').forEach((b) => { b.onclick = () => { st.cat = b.dataset.cat; render(); }; });
}

function officialCards() {
  const s = T();
  return (st.data.official || []).map((o) => `<article class="card">
    <div class="r1"><div class="nm">${esc(txt(o).name)}</div><span class="pill off">${s.noInstall}</span></div>
    <div class="sm">${esc(txt(o).summary)}</div>
    ${txt(o).caveats ? `<div class="cv">⚠ ${esc(txt(o).caveats)}</div>` : ''}
    <div class="acts"><span class="spacer"></span>${o.url
      ? `<a class="btn go" href="${esc(o.url)}" target="_blank" rel="noopener">${s.open}</a>`
      : `<span class="muted" style="font-size:12px">${s.steps}</span>`}</div>
  </article>`).join('');
}

function render() {
  const s = T();
  renderNav();
  const pane = el('.scroll');
  const keepScroll = pane.scrollTop;
  const apps = visible();
  const order = st.data.categories.map((c) => c.id);
  const groups = [...order].map((cid) => [cid, apps.filter((a) => a.category === cid)]).filter(([, items]) => items.length);
  const total = st.data.apps.length + (st.data.official || []).length;
  const cat = st.data.categories.find((c) => c.id === st.cat);
  el('#viewTitle').textContent = cat ? catTitle(cat) : s.all;
  el('#viewCount').textContent = `${apps.length} ${s.of} ${total}`;

  el('#list').innerHTML = (groups.map(([cid, items]) => {
    const c = st.data.categories.find((x) => x.id === cid);
    return `<h2>${esc(catTitle(c))}</h2><div class="grid">${items.map(card).join('')}</div>`;
  }).join('') || `<p class="empty">${s.empty}</p>`)
    + (st.cat === 'all' && !st.q.trim() ? `<h2>${s.officialTitle}</h2><div class="grid">${officialCards()}</div>` : '');

  el('#list').querySelectorAll('.card[data-id]').forEach((node) => {
    const id = node.dataset.id;
    const inst = node.querySelector('.inst');
    if (inst && !inst.disabled) inst.onclick = () => act('/api/install', id);
    const upg = node.querySelector('.upg');
    if (upg) upg.onclick = () => act('/api/upgrade', id);
    node.querySelector('.planbox').onchange = (e) => {
      e.target.checked ? st.plan.add(id) : st.plan.delete(id);
      renderPlan();
    };
  });
  renderPlan();
  pane.scrollTop = keepScroll;
}

function renderPlan() {
  el('#plan').classList.toggle('show', st.plan.size > 0);
  el('#planCount').textContent = `${T().planCount} ${st.plan.size}`;
}

async function act(path, id) {
  const s = T();
  const name = st.data.apps.find((a) => a.id === id).name;
  const location = el('#useLoc').checked ? el('#loc').value.trim() : '';
  say(s.starting + ' ' + name + '…');
  try {
    await api(path, { id, silent: el('#silent').checked, location });
    el('#jobsBox').classList.remove('hide', 'off');
    await tick();
    say(name + ': ' + s.started);
  } catch (e) { say(s.error + ' ' + e.message, 'bad'); }
}

function jobRow(j) {
  const s = T();
  return `<div class="job">
    <div class="jr"><b>${esc(j.appName)}</b><span class="st ${esc(j.status)}">${esc(j.status)}</span>
      ${j.status === 'running' ? `<button class="btn" data-cancel="${esc(j.id)}">${s.cancel}</button>` : ''}
      <span class="spacer"></span><span class="muted" style="font-size:12px">${j.mode === 'upgrade' ? s.upgradeMode : s.installMode}${j.location ? ' → ' + esc(j.location) : ''}</span></div>
    <details><summary>${s.logTitle}</summary><pre>${esc(j.tail || s.logEmpty)}</pre></details>
  </div>`;
}

async function tick() {
  const s = T();
  st.jobs = await api('/api/jobs');
  if (st.jobs.length) el('#jobsBox').classList.remove('off');
  const running = st.jobs.filter((j) => j.status === 'running').length;
  el('#jobsBadge').textContent = running ? `${s.jobsRunning} ${running}` : `${st.jobs.length} ${s.jobsCount}`;
  el('#jobsBadge').className = 'badge' + (running ? ' live' : '');
  el('#jobs').innerHTML = st.jobs.length ? st.jobs.map(jobRow).join('') : `<div class="empty">${s.jobsEmpty}</div>`;
  el('#jobs').querySelectorAll('[data-cancel]').forEach((b) => { b.onclick = async () => { await api('/api/cancel', { jobId: b.dataset.cancel }); await tick(); render(); }; });
  clearTimeout(tick.timer);
  if (running) { st.wasRunning = true; tick.timer = setTimeout(tick, 1200); render(); }
  else if (st.wasRunning) { st.wasRunning = false; await refreshInstalled(); }
  return running;
}

function markChip() {
  const v = el('#loc').value.trim();
  el('#locChips').querySelectorAll('.chip').forEach((b) => b.classList.toggle('on', b.dataset.p === v));
}

async function loadLocations() {
  const r = await api('/api/locations');
  if (!el('#loc').value.trim()) el('#loc').value = r.suggested[0] || '';
  el('#locChips').innerHTML = r.suggested.map((p) => `<button class="chip" data-p="${esc(p)}" title="${esc(p)}">${esc(p)}</button>`).join('');
  el('#locChips').querySelectorAll('.chip').forEach((b) => {
    b.onclick = () => { el('#loc').value = b.dataset.p; el('#useLoc').checked = true; markChip(); };
  });
  markChip();
}

function applyStrings() {
  const s = T();
  el('#tagline').textContent = s.tagline;
  el('#q').placeholder = s.search;
  el('#tUseLoc').textContent = s.useLoc;
  el('#browse').textContent = s.browse;
  el('#browse').title = s.browse;
  el('#locNote').textContent = s.locNote;
  el('#tSilent').textContent = s.silent;
  el('#tDetails').textContent = s.details;
  el('#detailsBody').innerHTML = s.detailsBody;
  el('#tJobs').textContent = s.jobs;
  el('#jobsToggle').textContent = s.jobsToggle;
  el('#planRun').textContent = s.planRun;
  el('#planClear').textContent = s.planClear;
  el('#sort').options[0].text = s.sortFidelity;
  el('#sort').options[1].text = s.sortName;
  el('#wingetNote').textContent = (st.data && st.data.dry ? s.dryNote + ' ' : '') + (st.data ? st.data.winget : '');
  el('#lang').querySelectorAll('button').forEach((b) => b.classList.toggle('on', b.dataset.lang === st.lang));
}

function setLang(lang) {
  st.lang = lang;
  localStorage.setItem('officehub.lang', lang);
  applyStrings();
  render();
  tick();
  api('/api/title', { title: st.data.windowTitle[st.lang] }).catch(() => {});
}

el('#lang').querySelectorAll('button').forEach((b) => { b.onclick = () => setLang(b.dataset.lang); });
el('#q').oninput = (e) => { st.q = e.target.value; render(); };
el('#sort').onchange = (e) => { st.sort = e.target.value; render(); };
el('#loc').oninput = markChip;
el('#useLoc').onchange = markChip;
el('#browse').onclick = async () => {
  const s = T();
  el('#browse').disabled = true;
  say(s.folderOpening);
  try {
    const r = await api('/api/browse', {});
    if (r.path) {
      el('#loc').value = r.path;
      el('#useLoc').checked = true;
      markChip();
      say(s.folderPicked + ' ' + r.path, 'ok');
    } else say(s.folderCanceled);
  } catch (e) { say(e.message, 'bad'); }
  el('#browse').disabled = false;
};
el('#jobsHead').onclick = () => el('#jobsBox').classList.toggle('hide');
el('#planClear').onclick = () => { st.plan.clear(); render(); };
el('#planRun').onclick = async () => {
  for (const id of [...st.plan]) {
    await act('/api/install', id);
    if (!st.data.dry) await new Promise((r) => setTimeout(r, 1500));
  }
};
document.addEventListener('keydown', (e) => {
  if (e.key === '/' && document.activeElement !== el('#q')) { e.preventDefault(); el('#q').focus(); }
  if (e.key === 'Escape') { el('#q').value = ''; st.q = ''; render(); }
});

async function refreshInstalled() {
  const data = await api('/api/catalog');
  st.data = Object.assign(st.data, data);
  if (data.scanError) say(T().error + ' ' + data.scanError, 'bad');
  applyStrings();
  render();
}

(async function boot() {
  st.data = await api('/api/catalog');
  applyStrings();
  render();
  loadLocations();
  await tick();
  if (!st.data.scannedAt) setTimeout(refreshInstalled, 2000);
})().catch((e) => say(T().catalogError + ' ' + e.message, 'bad'));
</script>
</body>
</html>
